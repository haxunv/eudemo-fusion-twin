[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eudemo-fusion-twin"
version = "0.1.0"
description = "EU-DEMO engineering digital twin with OpenUSD, NVIDIA RTX and Warp"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "warp-lang==1.13.0", "usd-core==25.11", "pillow==12.3.0"]

[tool.setuptools.packages.find]
where = ["app"]

